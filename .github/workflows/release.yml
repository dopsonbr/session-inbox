name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = publish VERSION as it stands, for the first release)"
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-latest # arm64: release artifacts are Apple silicon only (G-027)
    steps:
      # A release from any other branch would still become "latest" for every install.
      - name: Refuse a ref other than the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::releases are cut from $DEFAULT only; this run is on $REF. Re-run the workflow from $DEFAULT."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile

      - name: Bump VERSION and commit
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          v=$(bun scripts/bump.ts "$BUMP")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Fail now, not after a ten-minute build, if this version is already out.
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::v$v is already released; pick a bump" && exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "Release v$v"

      - run: bun test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun scripts/smoke.ts
      - run: cargo test && cargo clippy -- -D warnings
        working-directory: apps/desktop/src-tauri

      - run: bun scripts/release.ts
      - run: bun scripts/verify-release.ts --require-app

      - name: Tag, push and publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.bump.outputs.version }}
        run: |
          git tag "v$V"
          # Both or neither: a pushed tag without its commit (or the reverse) is a broken release.
          git push --atomic origin "HEAD:$GITHUB_REF" "v$V"
          a="dist/release/session-inbox-$V-macos-arm64.tar.gz"
          gh release create "v$V" "$a" "$a.sha256" install.sh --title "Session Inbox v$V" --generate-notes
