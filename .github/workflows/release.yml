name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-latest # arm64: release artifacts are Apple silicon only (G-027)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile

      - name: Bump VERSION and commit
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          v=$(bun scripts/bump.ts "$BUMP")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$v"

      - run: bun test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun scripts/smoke.ts
      - run: cargo test && cargo clippy -- -D warnings
        working-directory: apps/desktop/src-tauri

      - run: bun scripts/release.ts

      - name: Tag, push and publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.bump.outputs.version }}
        run: |
          git tag "v$V"
          git push origin "HEAD:$GITHUB_REF" "v$V"
          a="dist/release/session-inbox-$V-macos-arm64.tar.gz"
          gh release create "v$V" "$a" "$a.sha256" install.sh --title "Session Inbox v$V" --generate-notes
