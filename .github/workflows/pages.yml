name: Docs site

# Builds site/ with scripts/build-site.ts and deploys it to GitHub Pages
# (https://dopsonbr.github.io/session-inbox/). Pages must be set to "GitHub Actions"
# as its source in the repository settings.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.ts"
      - "README.md"
      - "DECISIONS.md"
      - "VERSION"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces one that hasn't started yet.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build and check the site
        run: bun scripts/build-site.ts --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
